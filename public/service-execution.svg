<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1A1A17" stroke-width="0.5" opacity="0.08"/>
    </pattern>
    <linearGradient id="eBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F5F0E8"/>
      <stop offset="100%" stop-color="#ede6d8"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="800" height="400" fill="url(#eBg)"/>
  <!-- Grid overlay -->
  <rect width="800" height="400" fill="url(#grid)"/>
  <!-- Blueprint circle large -->
  <circle cx="400" cy="200" r="140" fill="none" stroke="#7C8C6E" stroke-width="1.5" opacity="0.3"/>
  <circle cx="400" cy="200" r="120" fill="none" stroke="#7C8C6E" stroke-width="1" opacity="0.2" stroke-dasharray="8 4"/>
  <circle cx="400" cy="200" r="100" fill="none" stroke="#C67D5B" stroke-width="0.8" opacity="0.25"/>
  <!-- Cross lines through center -->
  <line x1="400" y1="50" x2="400" y2="350" stroke="#1A1A17" stroke-width="0.5" opacity="0.1"/>
  <line x1="250" y1="200" x2="550" y2="200" stroke="#1A1A17" stroke-width="0.5" opacity="0.1"/>
  <!-- Diagonal lines -->
  <line x1="300" y1="100" x2="500" y2="300" stroke="#1A1A17" stroke-width="0.5" opacity="0.07"/>
  <line x1="500" y1="100" x2="300" y2="300" stroke="#1A1A17" stroke-width="0.5" opacity="0.07"/>
  <!-- Blueprint building shape -->
  <rect x="340" y="150" width="120" height="100" rx="2" fill="none" stroke="#7C8C6E" stroke-width="2" opacity="0.4"/>
  <rect x="355" y="165" width="35" height="30" rx="1" fill="#7C8C6E" opacity="0.1" stroke="#7C8C6E" stroke-width="1" opacity="0.3"/>
  <rect x="410" y="165" width="35" height="30" rx="1" fill="#7C8C6E" opacity="0.1" stroke="#7C8C6E" stroke-width="1" opacity="0.3"/>
  <rect x="370" y="215" width="60" height="35" rx="1" fill="#C67D5B" opacity="0.1" stroke="#C67D5B" stroke-width="1" opacity="0.3"/>
  <!-- Construction crane abstract -->
  <line x1="150" y1="80" x2="150" y2="320" stroke="#1A1A17" stroke-width="2" opacity="0.15"/>
  <line x1="150" y1="100" x2="300" y2="100" stroke="#1A1A17" stroke-width="1.5" opacity="0.15"/>
  <line x1="300" y1="100" x2="300" y2="150" stroke="#1A1A17" stroke-width="1" opacity="0.1" stroke-dasharray="4 3"/>
  <line x1="150" y1="100" x2="120" y2="80" stroke="#1A1A17" stroke-width="1" opacity="0.12"/>
  <!-- Dimension arrows -->
  <line x1="340" y1="270" x2="460" y2="270" stroke="#C67D5B" stroke-width="1" opacity="0.3"/>
  <polygon points="340,267 340,273 333,270" fill="#C67D5B" opacity="0.3"/>
  <polygon points="460,267 460,273 467,270" fill="#C67D5B" opacity="0.3"/>
  <!-- Small accent circles -->
  <circle cx="340" cy="150" r="4" fill="#7C8C6E" opacity="0.4"/>
  <circle cx="460" cy="150" r="4" fill="#7C8C6E" opacity="0.4"/>
  <circle cx="340" cy="250" r="4" fill="#7C8C6E" opacity="0.4"/>
  <circle cx="460" cy="250" r="4" fill="#7C8C6E" opacity="0.4"/>
  <!-- Compass rose bottom right -->
  <circle cx="660" cy="310" r="35" fill="none" stroke="#D4C9B8" stroke-width="1.5"/>
  <circle cx="660" cy="310" r="25" fill="none" stroke="#C67D5B" stroke-width="0.8" opacity="0.4"/>
  <line x1="660" y1="272" x2="660" y2="348" stroke="#1A1A17" stroke-width="0.8" opacity="0.15"/>
  <line x1="622" y1="310" x2="698" y2="310" stroke="#1A1A17" stroke-width="0.8" opacity="0.15"/>
  <polygon points="660,275 655,290 665,290" fill="#C67D5B" opacity="0.4"/>
  <!-- Sage accent shapes top left -->
  <rect x="60" y="60" width="50" height="50" rx="3" fill="none" stroke="#7C8C6E" stroke-width="1" opacity="0.2"/>
  <circle cx="85" cy="85" r="15" fill="#7C8C6E" opacity="0.1"/>
  <!-- Top right detail -->
  <rect x="620" y="50" width="80" height="12" rx="2" fill="#D4C9B8" opacity="0.4"/>
  <rect x="620" y="70" width="55" height="8" rx="2" fill="#D4C9B8" opacity="0.3"/>
  <rect x="620" y="84" width="68" height="8" rx="2" fill="#7C8C6E" opacity="0.15"/>
</svg>