<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="cBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F5F0E8"/>
      <stop offset="100%" stop-color="#ede5d5"/>
    </linearGradient>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="1" fill="#1A1A17" opacity="0.08"/>
    </pattern>
  </defs>
  <!-- Background -->
  <rect width="800" height="400" fill="url(#cBg)"/>
  <!-- Dot pattern overlay -->
  <rect width="800" height="400" fill="url(#dots)"/>
  <!-- Large compass circle -->
  <circle cx="400" cy="200" r="150" fill="none" stroke="#D4C9B8" stroke-width="2" opacity="0.5"/>
  <circle cx="400" cy="200" r="130" fill="none" stroke="#D4C9B8" stroke-width="1" opacity="0.3" stroke-dasharray="4 6"/>
  <circle cx="400" cy="200" r="110" fill="none" stroke="#C67D5B" stroke-width="1.5" opacity="0.25"/>
  <circle cx="400" cy="200" r="8" fill="#C67D5B" opacity="0.4"/>
  <!-- Compass cardinal lines -->
  <line x1="400" y1="45" x2="400" y2="355" stroke="#1A1A17" stroke-width="0.5" opacity="0.1" stroke-dasharray="8 4"/>
  <line x1="245" y1="200" x2="555" y2="200" stroke="#1A1A17" stroke-width="0.5" opacity="0.1" stroke-dasharray="8 4"/>
  <!-- Compass needle -->
  <polygon points="400,65 393,200 407,200" fill="#C67D5B" opacity="0.3"/>
  <polygon points="400,335 393,200 407,200" fill="#D4C9B8" opacity="0.3"/>
  <!-- Blueprint zone outlines - left -->
  <rect x="80" y="100" width="140" height="90" rx="3" fill="none" stroke="#7C8C6E" stroke-width="1" opacity="0.25" stroke-dasharray="6 3"/>
  <line x1="80" y1="130" x2="220" y2="130" stroke="#7C8C6E" stroke-width="0.5" opacity="0.15" stroke-dasharray="3 3"/>
  <rect x="95" y="140" width="40" height="30" rx="2" fill="#7C8C6E" opacity="0.08"/>
  <rect x="145" y="140" width="60" height="30" rx="2" fill="#7C8C6E" opacity="0.06"/>
  <!-- Planning text lines (abstract) -->
  <rect x="95" y="108" width="50" height="4" rx="2" fill="#1A1A17" opacity="0.1"/>
  <rect x="155" y="108" width="30" height="4" rx="2" fill="#C67D5B" opacity="0.15"/>
  <!-- Blueprint zone - right -->
  <rect x="580" y="220" width="150" height="100" rx="3" fill="none" stroke="#C67D5B" stroke-width="1" opacity="0.25" stroke-dasharray="6 3"/>
  <line x1="580" y1="255" x2="730" y2="255" stroke="#C67D5B" stroke-width="0.5" opacity="0.15" stroke-dasharray="3 3"/>
  <rect x="595" y="265" width="55" height="35" rx="2" fill="#C67D5B" opacity="0.06"/>
  <rect x="660" y="265" width="55" height="35" rx="2" fill="#C67D5B" opacity="0.08"/>
  <rect x="595" y="228" width="70" height="4" rx="2" fill="#1A1A17" opacity="0.1"/>
  <rect x="675" y="228" width="35" height="4" rx="2" fill="#C67D5B" opacity="0.12"/>
  <!-- Connecting dotted lines from zones to compass -->
  <path d="M220 145 Q310 160 330 185" fill="none" stroke="#7C8C6E" stroke-width="1" opacity="0.2" stroke-dasharray="4 4"/>
  <path d="M580 270 Q510 250 470 215" fill="none" stroke="#C67D5B" stroke-width="1" opacity="0.2" stroke-dasharray="4 4"/>
  <!-- Small measurement circles -->
  <circle cx="220" cy="145" r="3" fill="#7C8C6E" opacity="0.3"/>
  <circle cx="580" cy="270" r="3" fill="#C67D5B" opacity="0.3"/>
  <circle cx="330" cy="185" r="3" fill="#7C8C6E" opacity="0.3"/>
  <circle cx="470" cy="215" r="3" fill="#C67D5B" opacity="0.3"/>
  <!-- Decorative terracotta accents -->
  <circle cx="150" cy="300" r="12" fill="none" stroke="#C67D5B" stroke-width="1" opacity="0.2"/>
  <circle cx="150" cy="300" r="5" fill="#C67D5B" opacity="0.15"/>
  <circle cx="650" cy="110" r="15" fill="none" stroke="#C67D5B" stroke-width="1" opacity="0.2"/>
  <circle cx="650" cy="110" r="6" fill="#C67D5B" opacity="0.15"/>
  <!-- Angle markers -->
  <path d="M400 200 L440 120" fill="none" stroke="#C67D5B" stroke-width="0.8" opacity="0.2"/>
  <path d="M400 200 L320 140" fill="none" stroke="#7C8C6E" stroke-width="0.8" opacity="0.2"/>
  <path d="M340 155 Q360 145 365 160" fill="none" stroke="#7C8C6E" stroke-width="0.5" opacity="0.2"/>
</svg>